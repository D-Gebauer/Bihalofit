[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bihalofit"
version = "0.1.0"
description = "Non-linear matter bispectrum (BiHalofit, Takahashi+ 2019) with Numba-JIT kernels."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "BiHalofit Python port" }
]
keywords = ["cosmology", "bispectrum", "large-scale-structure", "halofit", "bihalofit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
    "numba>=0.57",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
bihalofit = "bihalofit.cli:main"

[project.urls]
"Original C++ BiHalofit (Takahashi)" = "http://cosmo.phys.hirosaki-u.ac.jp/takahasi/codes_e.htm"
"Paper" = "https://arxiv.org/abs/1911.07886"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bihalofit = ["data/*.txt"]
